# One command stands up the entire sovereign stack. Portable to any VPS.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to LOOPBACK only. The Prisma CLI (introspect, migrate, studio) runs on the host
    # rather than in the container, so it needs a reachable port — but 127.0.0.1 means it is
    # not exposed off this machine. On the VPS, remove this mapping entirely.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds no durable truth here — it fans events between backend instances and holds
    # rate-limit counters. Persistence is off on purpose: a restart should lose nothing that
    # matters, and an AOF/RDB file would just be one more thing to back up.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overridable from the shell so the verification suites can force the dev-log transport
      # (they read the code back out of the response) without editing .env — which would
      # otherwise mean flipping a real credential setting back and forth to run tests.
      # Unset in the shell, Compose resolves this from .env as normal.
      OTP_TRANSPORT: ${OTP_TRANSPORT:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # DEV ONLY: plain-HTTP listener so a real phone on the LAN can reach the stack.
      # Remove this mapping (and the :8080 block in the Caddyfile) before a public deploy.
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
