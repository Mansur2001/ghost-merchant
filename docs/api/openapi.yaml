        "200": { description: Saved, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/operator/topups:
    get:
      tags: [Operator]
      summary: USSD wallet top-ups to check, and those decided in the last 3 days
      responses:
        "200": { description: Top-ups, content: { application/json: { schema: { type: object } } } }

  /api/operator/topups/{id}/confirm:
    post:
      tags: [Operator]
      summary: The money is on the merchant phone — credit the wallet (reference required, UNIQUE)
      description: 403 in api mode, where only the gateway credits a wallet.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string } } } } } }
      responses:
        "200": { description: Credited, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: api mode }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already decided, or the reference was used }

  /api/operator/topups/{id}/reject:
    post:
      tags: [Operator]
      summary: Not on the merchant phone — reject with a reason the customer sees
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string } } } } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/operator/drivers/{id}/profile:
    post:
      tags: [Admin]
      summary: Role (driver/technician), trades and plate — what customers see and which jobs dispatch gives (audited)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { role: { type: string, enum: [driver, technician] }, trades: { type: array, items: { type: string } }, plate: { type: string } } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Has active jobs (role change) }

  /api/operator/drivers/{id}/photo:
    post:
      tags: [Admin]
      summary: The driver's photo customers choose by (raw JPEG/PNG/WebP; audited)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { image/*: {} } }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A customer, driver or operator token. Its role decides what you may call.
    uploadToken:
      type: http
      scheme: bearer
      description: The 15-minute `uploadToken` returned by POST /api/signup, valid for that request only.
    webhookSignature:
      type: apiKey
      in: header
      name: X-GK-Signature
      description: hex(HMAC-SHA256(PAYMENT_WEBHOOK_SECRET, "<timestamp>.<raw body>"))
    webhookTimestamp:
      type: apiKey
      in: header
      name: X-GK-Timestamp
      description: Unix seconds; within 5 minutes of the server clock.

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order UUID. Anything else is a 404.
      schema: { type: string, format: uuid }

  requestBodies:
    Image:
      required: true
      description: Raw image bytes, at most 6 MB. A re-upload replaces the previous one of that kind.
      content:
        image/jpeg: { schema: { type: string, format: binary } }
        image/png: { schema: { type: string, format: binary } }
        image/webp: { schema: { type: string, format: binary } }
        image/heic: { schema: { type: string, format: binary } }

  responses:
    BadRequest:
      description: The request itself is wrong (reason in `error`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: No valid token / credentials / signature
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Doesn't exist — or isn't yours. Deliberately the same answer.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AdminsOnly:
      description: Signed in as an operator without admin rights
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests — wait `retryAfter` seconds
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PhotoSaved:
      description: Stored
      content:
        application/json:
          schema:
            type: object
            properties:
              photo:
                type: object
                properties:
                  id: { type: string }
                  order_id: { type: string, format: uuid }
                  kind: { type: string, enum: [order_ref, pickup_proof, delivery_proof] }
                  object_key: { type: string }
                  content_type: { type: [string, "null"] }
                  uploaded_by: { type: string }
                  created_at: { type: string, format: date-time }
    StaffCreated:
      description: Account created / code re-sent. `error` set = account exists but the email failed — re-send.
      content:
        application/json:
          schema:
            type: object
            properties:
              role: { type: string, enum: [driver, operator] }
              account: { type: object }
              sentVia: { type: string, enum: [email, sms] }
              smsSent: { type: boolean, description: "Legacy name: true when the code was delivered by any channel" }
              error: { type: string }
              devCode: { type: string, description: Development only }

  schemas:
    CustomerSession:
      type: object
      properties:
        token: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        expiresInSeconds: { type: integer, example: 2592000 }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "not found" }
        ref: { type: string, description: "First 8 chars of X-Request-Id — quote it when reporting", example: 1a2b3c4d }
        cause: { type: string, description: "Server failures only, e.g. DB-P1001, EMAIL-HTTP403" }
        retryAfter: { type: integer, description: 429 only }

    Status:
      type: string
      enum: [PENDING_PAYMENT, PAID_UNASSIGNED, DISPATCHED, IN_TRANSIT, DELIVERED, FAILED_REFUND]

    JobRequest:
      type: object
      required: [kind, phone]
      properties:
        kind: { type: string, enum: [RIDE, DELIVERY] }
        id: { type: string, format: uuid }
        phone: { type: string, description: The number the driver calls }
        vehicle: { type: string, enum: [bajaj, car], description: Rides }
        pickup: { $ref: "#/components/schemas/PointOrPlace" }
        pickupNote: { type: string, maxLength: 200 }
        dropoff: { $ref: "#/components/schemas/PointOrPlace" }
        pickupPlaceId: { type: integer, description: "Deliveries: the market (default: nearest to the door)" }
        landmark: { type: string, description: Required for a delivery }
        expectedTotal: { type: string, description: The total the customer saw; a mismatch is a 409 }
        cart:
          type: object
          properties:
            lines: { type: array, maxItems: 30, items: { type: object, properties: { itemId: { type: integer }, qty: { type: integer, minimum: 1, maximum: 50 } } } }
            custom: { type: object, properties: { text: { type: string, maxLength: 300 }, budget: { type: number, minimum: 0.5, maximum: 500 } } }

    PointOrPlace:
      oneOf:
        - { type: object, required: [lat, lng], properties: { lat: { type: number }, lng: { type: number } } }
        - { type: object, required: [placeId], properties: { placeId: { type: integer } } }

    Quote:
      type: object
      properties:
        kind: { type: string, enum: [RIDE, DELIVERY] }
        distance_m: { type: [integer, "null"] }
        minutes: { type: [integer, "null"] }
        route_source: { type: string, enum: [osrm, estimate, none] }
        pickup: { type: [object, "null"] }
        dropoff: { type: object }
        subtotal: { type: string, description: Deliveries }
        fee: { type: string, description: Deliveries }
        total: { type: string, description: Deliveries }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        options:
          type: array
          description: Rides — one per vehicle
          items: { type: object, properties: { vehicle: { type: string }, fee: { type: string }, total: { type: string }, available: { type: integer } } }

    PaymentAttempt:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, declined, unknown] }
        wallet: { type: string, enum: [evc, zaad, sahal] }
        detail: { type: [string, "null"] }

    CatalogCategory:
      type: object
      properties:
        id: { type: integer }
        name_en: { type: string }
        name_so: { type: string }
        icon: { type: string }
        items: { type: array, items: { type: object, properties: { id: { type: integer }, name_en: { type: string }, name_so: { type: string }, unit_en: { type: string }, unit_so: { type: string }, price: { type: string } } } }

    CatalogCategoryInput:
      type: object
      properties: { name_en: { type: string }, name_so: { type: string }, icon: { type: string }, sort: { type: integer }, active: { type: boolean } }

    CatalogItemInput:
      type: object
      properties: { category_id: { type: integer }, name_en: { type: string }, name_so: { type: string }, unit_en: { type: string }, unit_so: { type: string }, price: { type: number }, sort: { type: integer }, active: { type: boolean } }

    Place:
      type: object
      properties: { id: { type: integer }, kind: { type: string, enum: [market, landmark, district] }, name_en: { type: string }, name_so: { type: string }, city: { type: string }, lat: { type: number }, lng: { type: number } }

    PlaceInput:
      type: object
      properties: { kind: { type: string, enum: [market, landmark, district] }, name_en: { type: string }, name_so: { type: string }, city: { type: string }, lat: { type: number }, lng: { type: number }, sort: { type: integer }, active: { type: boolean } }

    Item:
      type: object
      properties:
        text: { type: string, example: "2kg rice, cooking oil" }
        price: { type: [number, string] }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: integer }
        user_phone: { type: string, description: The number the driver calls }
        status: { $ref: "#/components/schemas/Status" }
        total_amount: { type: string, example: "7.50" }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        landmark_text: { type: string }
        driver_id: { type: [string, "null"], description: Set by automatic dispatch }
        payment_claimed_at: { type: [string, "null"], format: date-time }
        payment_claim_ref: { type: [string, "null"] }
        payment_claim_wallet: { type: [string, "null"] }
        kind: { type: string, enum: [DELIVERY, RIDE, PARCEL, SERVICE] }
        pickup_lat: { type: [number, "null"] }
        pickup_lng: { type: [number, "null"] }
        pickup_text: { type: [string, "null"] }
        vehicle: { type: [string, "null"], enum: [bajaj, car, null] }
        distance_m: { type: [integer, "null"] }
        subtotal: { type: [string, "null"] }
        fee: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentInstruction:
      type: object
      properties:
        paymentMethod: { type: string, enum: [ussd, manual] }
        wallets:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [evc, edahab, zaad, sahal] }
              name: { type: string, example: EVC Plus }
              ussdUri: { type: string, example: "tel:*712*612345678*7.50%23", description: "Use verbatim — the # is pre-encoded as %23" }
        ussdUri: { type: [string, "null"], description: Legacy single-wallet field }
        paymentNote: { type: [string, "null"] }
        appPay:
          type: array
          description: Wallets the app can charge directly (POST /orders/{id}/pay). Empty until WaafiPay is configured.
          items: { type: object, properties: { id: { type: string, enum: [evc, zaad, sahal] }, name: { type: string } } }

    OrderWithPayment:
      allOf:
        - type: object
          properties:
            order: { $ref: "#/components/schemas/Order" }
            created: { type: boolean }
        - $ref: "#/components/schemas/PaymentInstruction"

    Message:
      type: object
      properties:
        id: { type: string }
        sender: { type: string, enum: [user, driver, operator, system] }
        body: { type: string }
        client_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    Fix:
      type: object
      description: The phone's GPS fix. Evidence, not a gate — omit it when the phone has none.
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracy: { type: number, description: metres }

    Proof:
      type: object
      properties:
        step: { type: string, enum: [pickup, delivery] }
        method: { type: string, enum: [photo, code, photo_no_code, no_code, dropoff] }
        note: { type: [string, "null"] }
        distance_m: { type: [integer, "null"], description: From the driver's fix to the customer's pin }
        accuracy_m: { type: [integer, "null"] }
        flags:
          type: array
          items: { type: string, enum: [no_code, no_gps, far_from_pin, customer_disputed] }
        created_at: { type: string, format: date-time }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }

    Refund:
      type: object
      properties:
        id: { type: string }
        amount: { type: string }
        reason: { type: [string, "null"] }
        status: { type: string, enum: [owed, settled, waived] }
        settlement_reference: { type: [string, "null"] }
        settlement_note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        order:
          type: object
          properties:
            id: { type: string, format: uuid }
            user_phone: { type: string }
            status: { $ref: "#/components/schemas/Status" }
            landmark_text: { type: string }

    Operator:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        active: { type: boolean }
        is_admin: { type: boolean }
        must_change_password: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        setup_pending: { type: boolean }
        has_email: { type: boolean }

    AccessRequest:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [driver, operator] }
        name: { type: string }
        phone: { type: [string, "null"], description: null while blind }
        email: { type: [string, "null"], description: null while blind }
        message: { type: [string, "null"], description: null while blind }
        blind: { type: boolean, description: true until approved or declined }
        status: { type: string, enum: [new, contacted, approved, declined] }
        id_document_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        account_created_at: { type: [string, "null"], format: date-time }

    PhoneCheck:
      type: object
      properties:
        valid: { type: boolean }
        e164: { type: string, example: "+252612345678" }
        country: { type: string }
        operator: { type: string, description: Somali network name, when known }
        reason: { type: string, description: Why it is invalid }
